  <!-- Aplicar el tema antes del primer paint para evitar el parpadeo claro/oscuro -->
  <script>
    (function () {
      try {
        var stored = localStorage.getItem("joaquin_portfolio_dark");
        var dark = stored !== null ? stored === "true" : true;
        var root = document.documentElement;
        root.classList.toggle("dark", dark);
        root.style.colorScheme = dark ? "dark" : "light";
        root.style.backgroundColor = dark ? "#06020e" : "#f8f8f9";
        root.style.color = dark ? "#f8f8f9" : "#06020e";
      } catch (e) {}
    })();
  </script>
